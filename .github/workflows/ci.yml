name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: true

      - name: Install pinned wasm-tools
        env:
          WASM_TOOLS_VERSION: "1.233.0"
        run: |
          curl -fsSL "https://github.com/bytecodealliance/wasm-tools/releases/download/v${WASM_TOOLS_VERSION}/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux.tar.gz" -o "$RUNNER_TEMP/wasm-tools.tar.gz"
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-tools-${WASM_TOOLS_VERSION}-x86_64-linux" >> "$GITHUB_PATH"

      - name: Check WIT regeneration
        run: make wit-check

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Race
        run: make race

      - name: Tidy
        run: make mod-tidy-check

      - name: Check external consumer
        run: make external-consumer-check

      - name: Lint
        run: make lint

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3
          cache: true
      - name: Vet PostgreSQL integration code
        run: go vet -tags=postgres_integration ./internal/testpostgres ./store/postgres ./runtime
      - name: Lint PostgreSQL integration code
        run: |
          make tools
          .bin/golangci-lint run --build-tags=postgres_integration ./...
      - name: PostgreSQL tests (required, zero skips)
        run: make postgres-test
      - name: PostgreSQL race tests (required, zero skips)
        run: make postgres-race
